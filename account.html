<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7c3aed"><title>ক্রেতা অ্যাকাউন্ট — Kine Dekhi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff1f5,#fff7df 55%,#f3e8ff);color:#282044;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}button,input{font:inherit}.wrap{width:min(440px,100%)}.back{display:inline-block;margin:0 0 14px;color:#7c3aed;font-weight:800;text-decoration:none}.card{background:#ffffffed;border:1px solid #f0d8ed;border-radius:24px;padding:24px;box-shadow:0 18px 50px #6b214015}.logo{font-weight:950;font-size:22px;color:#7c3aed}.logo span{color:#f59e0b}h1{font-size:25px;margin:15px 0 6px}p{color:#71647b;line-height:1.65;margin:0 0 18px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#f7f0fb;padding:5px;border-radius:12px;margin:18px 0}.tabs button{border:0;border-radius:9px;padding:10px;background:transparent;color:#6b5a7a;font-weight:800;cursor:pointer}.tabs button.active{background:#7c3aed;color:#fff;box-shadow:0 5px 12px #7c3aed25}label{display:block;font-weight:800;font-size:13px;margin:13px 0 6px}input{width:100%;padding:12px 13px;border:1px solid #e6dce9;border-radius:11px;background:#fff;outline:none}input:focus{border-color:#a855f7;box-shadow:0 0 0 3px #a855f71c}.primary{width:100%;border:0;border-radius:12px;background:linear-gradient(100deg,#f43f5e,#db2777,#7c3aed);color:#fff;font-weight:900;padding:13px;margin-top:18px;cursor:pointer}.secondary{width:100%;border:1px solid #e9d5ff;border-radius:12px;background:#faf5ff;color:#7c3aed;font-weight:800;padding:11px;margin-top:10px;cursor:pointer}.status{font-size:13px;line-height:1.6;margin-top:13px;padding:10px;border-radius:10px;display:none;overflow-wrap:anywhere}.status.show{display:block}.status.error{background:#fff1f2;color:#be123c}.status.info{background:#eff6ff;color:#1d4ed8}.status.success{background:#ecfdf5;color:#047857}.hint{font-size:12px;margin-top:14px;color:#7a6c81}.profile{display:none}.profile .email{overflow-wrap:anywhere;background:#f7f0fb;padding:10px;border-radius:10px;margin:12px 0}@media(max-width:400px){.card{padding:19px}h1{font-size:22px}}
</style></head>
<body><main class="wrap"><a class="back" href="./">← দোকানে ফিরে যান</a><section class="card">
<a class="logo" href="./" style="text-decoration:none">🛍️ Kine <span>Dekhi</span></a>
<div id="authPanel"><h1 id="heading">আপনার অ্যাকাউন্টে স্বাগতম</h1><p id="subheading">লগইন করুন অথবা নতুন অ্যাকাউন্ট খুলে সহজে কেনাকাটা করুন।</p>
<div class="tabs"><button type="button" class="active" id="loginTab">লগইন</button><button type="button" id="signupTab">নতুন অ্যাকাউন্ট</button></div>
<form id="authForm"><div id="nameField" hidden><label for="fullName">আপনার নাম</label><input id="fullName" autocomplete="name" maxlength="100" placeholder="সম্পূর্ণ নাম"></div>
<label for="email">ইমেল</label><input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="আপনার ইমেল লিখুন">
<label for="password">পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password" required minlength="6" maxlength="128" placeholder="কমপক্ষে ৬ অক্ষর">
<button class="primary" id="submitBtn" type="submit">লগইন করুন</button></form>
<div id="status" class="status" role="status" aria-live="polite"></div>
<div class="hint">অ্যাকাউন্ট খোলা বাধ্যতামূলক নয়। <a href="./" style="color:#7c3aed">লগইন ছাড়াই কেনাকাটা করুন</a>।</div></div>
<div id="profilePanel" class="profile"><h1>আপনি লগইন করেছেন 🎉</h1><p>আপনার Kine Dekhi অ্যাকাউন্ট সক্রিয় আছে।</p><div class="email" id="profileInfo"></div><button class="primary" id="shopBtn" type="button">কেনাকাটা চালিয়ে যান</button><button class="secondary" id="logoutBtn" type="button">লগআউট</button><div id="profileStatus" class="status" role="status"></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<script>
"use strict";
const SUPABASE_URL="https://jyrzdtitmdsxzxtxhecu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_saBTFA1ddc3ICx3t_sPjiw_BKjGLl5o";
const $=id=>document.getElementById(id);
let mode="login",client=null;
function showStatus(message,type="info",target="status"){const el=$(target);el.textContent=message;el.className="status show "+type}
function setMode(next){mode=next;const signup=mode==="signup";$("loginTab").classList.toggle("active",!signup);$("signupTab").classList.toggle("active",signup);$("nameField").hidden=!signup;$("fullName").required=signup;$("heading").textContent=signup?"নতুন অ্যাকাউন্ট খুলুন":"আপনার অ্যাকাউন্টে স্বাগতম";$("subheading").textContent=signup?"নাম, ইমেল ও পাসওয়ার্ড দিয়ে নিবন্ধন করুন।":"আপনার ইমেল ও পাসওয়ার্ড দিয়ে লগইন করুন।";$("submitBtn").textContent=signup?"অ্যাকাউন্ট তৈরি করুন":"লগইন করুন";$("password").autocomplete=signup?"new-password":"current-password";$("status").className="status";$("status").textContent=""}
function showProfile(user){$("authPanel").style.display="none";$("profilePanel").style.display="block";$("profileInfo").textContent=(user.user_metadata?.full_name||"ক্রেতা")+" · "+user.email}
function showAuth(){ $("authPanel").style.display="block";$("profilePanel").style.display="none"}
async function init(){if(!window.supabase){showStatus("লগইন সেবা লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করে পেজ রিফ্রেশ করুন।","error");$("submitBtn").disabled=true;return}client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const {data,error}=await client.auth.getSession();if(error){showStatus("সেশন যাচাই করা যায়নি। আবার চেষ্টা করুন।","error");return}if(data.session)showProfile(data.session.user);client.auth.onAuthStateChange((_event,session)=>{if(session)showProfile(session.user);else showAuth()})}
$("loginTab").addEventListener("click",()=>setMode("login"));$("signupTab").addEventListener("click",()=>setMode("signup"));
$("authForm").addEventListener("submit",async e=>{e.preventDefault();if(!client)return;const email=$("email").value.trim().toLowerCase(),password=$("password").value,name=$("fullName").value.trim();if(mode==="signup"&&!name){showStatus("আপনার নাম লিখুন।","error");return}const btn=$("submitBtn");btn.disabled=true;btn.textContent="অপেক্ষা করুন…";$("status").className="status";try{if(mode==="signup"){const {data,error}=await client.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;if(data.session&&data.user){showProfile(data.user)}else{showStatus("নিবন্ধনের অনুরোধ হয়েছে। ইমেলে নিশ্চিতকরণ লিংক এলে সেটি খুলে অ্যাকাউন্ট চালু করুন; তারপর লগইন করুন।","success");setMode("login")}}else{const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;if(data.user)showProfile(data.user)}}catch(err){let msg=err.message||"অনুরোধ সম্পন্ন হয়নি।";if(/invalid login credentials/i.test(msg))msg="ইমেল বা পাসওয়ার্ড সঠিক নয়।";if(/user already registered/i.test(msg))msg="এই ইমেল দিয়ে আগে অ্যাকাউন্ট খোলা হয়েছে—লগইন করুন।";showStatus(msg,"error")}finally{btn.disabled=false;btn.textContent=mode==="signup"?"অ্যাকাউন্ট তৈরি করুন":"লগইন করুন"}});
$("shopBtn").addEventListener("click",()=>location.href="./");$("logoutBtn").addEventListener("click",async()=>{const b=$("logoutBtn");b.disabled=true;const {error}=await client.auth.signOut();b.disabled=false;if(error)showStatus("লগআউট হয়নি। আবার চেষ্টা করুন।","error","profileStatus")});
init();
</script></body></html>
