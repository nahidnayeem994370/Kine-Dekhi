<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c3aed"><title>পণ্যের বিস্তারিত — Kine Dekhi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8f3;color:#282044;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}.wrap{width:min(1000px,calc(100% - 28px));margin:auto}.top{background:#fff;padding:16px 0;border-bottom:1px solid #f1dfd8}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:950;font-size:23px;color:#7c3aed;text-decoration:none}.logo span{color:#f59e0b}.link{display:inline-block;background:#7c3aed;color:white;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:800}.card{margin:28px auto;background:white;border:1px solid #f1dfd8;border-radius:22px;padding:clamp(16px,4vw,32px);display:grid;grid-template-columns:1fr 1fr;gap:28px;box-shadow:0 12px 30px #5b25420c}.photo{min-height:300px;border-radius:16px;background:linear-gradient(145deg,#fff0f3,#f3e8ff);display:grid;place-items:center;overflow:hidden;font-size:90px}.photo img{width:100%;max-height:520px;object-fit:contain}.cat{color:#7c3aed;font-weight:800;font-size:13px}.name{font-size:clamp(25px,4vw,36px);line-height:1.25;margin:10px 0}.price{font-size:28px;font-weight:950;color:#e11d48}.old{font-size:15px;color:#999;text-decoration:line-through;margin-left:8px}.desc{line-height:1.9;color:#6b6680;white-space:pre-wrap}.notice{padding:13px;border-radius:12px;background:#f3e8ff;color:#6b21a8;line-height:1.7}.loading{text-align:center;padding:50px}.error{color:#be123c}@media(max-width:650px){.card{grid-template-columns:1fr;gap:18px;margin:16px auto}.photo{min-height:230px}.toprow{align-items:center}.logo{font-size:20px}}
</style></head><body><header class="top"><div class="wrap toprow"><a class="logo" href="./index.html">Kine <span>Dekhi</span></a><a class="link" href="./index.html#products">← সব পণ্য</a></div></header><main class="wrap"><div id="content" class="loading">পণ্যের তথ্য লোড হচ্ছে…</div></main>
<script>
const SUPABASE_URL="https://jyrzdtitmdsxzxtxhecu.supabase.co",KEY="sb_publishable_saBTFA1ddc3ICx3t_sPjiw_BKjGLl5o";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"৳"+Number(n||0).toLocaleString("bn-BD");
(async()=>{const id=new URLSearchParams(location.search).get("id");const root=document.getElementById("content");if(!id){root.innerHTML='<p class="error">পণ্য নির্বাচন করা হয়নি।</p><a class="link" href="./index.html">দোকানে ফিরে যান</a>';return}try{const res=await fetch(SUPABASE_URL+"/rest/v1/products?select=id,name,description,price,original_price,image_url,image_urls,is_active,categories(name)&id=eq."+encodeURIComponent(id)+"&is_active=eq.true",{headers:{apikey:KEY}});if(!res.ok)throw Error("পণ্যের তথ্য পাওয়া যায়নি");const rows=await res.json();const p=rows[0];if(!p)throw Error("পণ্যটি পাওয়া যায়নি বা আর উপলব্ধ নেই");const imgs=[...(Array.isArray(p.image_urls)?p.image_urls:[]),p.image_url].filter(Boolean);document.title=p.name+" — Kine Dekhi";root.className="card";root.innerHTML='<div class="photo">'+(imgs.length?'<img src="'+esc(imgs[0])+'" alt="'+esc(p.name)+'">':'🛍️')+'</div><section><div class="cat">'+esc(p.categories?.name||"পণ্য")+'</div><h1 class="name">'+esc(p.name)+'</h1><div class="price">'+money(p.price)+(Number(p.original_price)>Number(p.price)?'<span class="old">'+money(p.original_price)+'</span>':"")+'</div><p class="desc">'+esc(p.description||"এই পণ্যের অতিরিক্ত বিবরণ এখনো যোগ করা হয়নি।")+'</p><div class="notice">অর্ডার করতে নিচের বোতামে চাপ দিয়ে মূল দোকানের পণ্য তালিকায় ফিরে যান।</div><p><a class="link" href="./index.html#products">দোকানে ফিরে অর্ডার করুন</a></p></section>'}catch(e){root.className="loading error";root.innerHTML=esc(e.message)+'<p><a class="link" href="./index.html">দোকানে ফিরে যান</a></p>'}})();
</script></body></html>
