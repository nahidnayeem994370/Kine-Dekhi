urrentCategory?2:0);return sb-sa}).slice(0,30);document.getElementById("relatedTitle").textContent="🛍️ আপনার পছন্দ অনুযায়ী আরও পণ্য"}if(recommendations.length){document.getElementById("relatedSection").hidden=false;document.getElementById("relatedGrid").innerHTML=recommendations.map(x=>{const im=(Array.isArray(x.image_urls)?x.image_urls:[])[0]||x.image_url;return '<a class="related-card" href="./product.html?id='+encodeURIComponent(x.id)+'"><div class="related-photo">'+(im?'<img loading="lazy" src="'+esc(im)+'" alt="'+esc(x.name)+'">':'🛍️')+'</div><div class="related-info"><div class="related-name">'+esc(x.name)+'</div><div class="related-price">'+money(x.price)+'</div></div></a>'}).join("")}}}catch(e){root.className="loading error";root.innerHTML=esc(e.message)+'<p><a class="link" href="./index.html">দোকানে ফিরে যান</a></p>'}})();
